{% include base_path %}
<!-- start custom head snippets -->
<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>
<!-- end custom head snippets -->

<!-- ===== custom styles ===== -->
<style>
  /* 1. 전체 글자 크기 살짝 줄이기 */
  html { font-size: 15px; }
  .page__content { font-size: 0.95em; line-height: 1.65; }
  .page__content p,
  .page__content li { font-size: 0.95em; }
  .page__content h2 { font-size: 1.4em; margin-top: 1.6em; }

/* 2. 프로필 사진: 둥근 모서리 네모 */
  .author__avatar img {
    border-radius: 12px !important;   /* 둥근 정도. 더 둥글게 16, 각지게 6 */
    max-width: 180px;
  }

  /* 사진 아래에 이름 표시 (사이드바 기본 name은 비워둠) */
  .author__avatar::after {
    content: "Sooyeon Song";
    display: block;
    text-align: center;
    font-size: 1.25em;
    font-weight: 700;
    margin-top: 12px;
    color: #1c1b18;
  }

  /* 3. publication / 항목 리스트 문단 간격 */
  .pub-list p { margin: 0 0 0.9em; }

  /* 4. abstract / full paper 링크 */
  .pub-link,
  details.abstract > summary {
    font-size: 0.9em;
    color: #2a6df4 !important;       /* 파란 링크 */
    cursor: pointer;
    text-decoration: none;
  }
  .pub-link { margin-left: 4px; }
  .pub-link:hover,
  details.abstract > summary:hover { text-decoration: underline; }

  /* details 인라인 + 기본 삼각형 제거 */
  details.abstract { display: inline; }
  details.abstract > summary { display: inline; list-style: none; }
  details.abstract > summary::-webkit-details-marker { display: none; }  /* Chrome/Safari */
  details.abstract > summary::marker { content: ""; }                     /* Firefox */

  /* abstract 펼침 박스: 단색 밝은 회색 네모 */
  details.abstract .abstract-body {
    display: block;
    font-size: 0.9em;
    line-height: 1.6;
    background: #f2f2f2;
    padding: 14px 16px;
    margin-top: 8px;
    border-radius: 4px;
  }
</style>
