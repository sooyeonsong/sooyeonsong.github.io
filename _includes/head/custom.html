{% include base_path %}
<!-- start custom head snippets -->
<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>
<!-- end custom head snippets -->

<!-- ===== custom styles ===== -->
<style>
  /* 1. 전체 글자 크기 살짝 줄이기 */
  html { font-size: 15px; }
  .page__content { font-size: 0.95em; line-height: 1.65; }
  .page__content p,
  .page__content li { font-size: 0.95em; }
  .page__content h2 { font-size: 1.4em; margin-top: 1.6em; }

  /* 2. 프로필 사진: 둥근 모서리 */
  .author__avatar img {
    border-radius: 12px !important;
    max-width: 180px;
  }
  /* 사진 아래 이름: 왼쪽 정렬 */
  .author__avatar::after {
    content: "Sooyeon Song";
    display: block;
    text-align: left;
    font-size: 1.25em;
    font-weight: 700;
    margin-top: 12px;
    color: #1c1b18;
  }
  /* 사이드바 기본 이름(author__name)은 _config.yml에서 비워둠 */

  /* 3. 항목 리스트 문단 간격 */
  .pub-list p { margin: 0 0 0.9em; }

  /* 4. Education 연도 우측 정렬 */
  .ed-row { display: flex; justify-content: space-between; align-items: baseline; }
  .ed-row .ed-year { font-weight: 400; color: #555; white-space: nowrap; padding-left: 12px; }

  /* 소제목 (Service 등): 크게 + 이탤릭 */
  .pub-list p.sub-head {
    font-size: 1.1em;
    font-style: italic;
    font-weight: 600;
    margin-top: 1.1em;
    margin-bottom: 0.4em;
  }

  /* 5. presentation 그룹 헤더 (Domestic / International) */
  .pub-list p.pres-group {
    font-size: 1.1em;
    font-style: italic;
    font-weight: 600;
    margin-top: 1.1em;
    margin-bottom: 0.4em;
  }

  /* 6. abstract / full paper 링크 — 제목 줄에 인라인 */
  .pub-link,
  .abstract > summary {
    color: #2a6df4 !important;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .pub-link { margin-left: 6px; }
  .pub-link:hover,
  .abstract > summary:hover { text-decoration: underline; }

  .pub-list details.abstract,
  details.abstract { display: inline !important; }
  .pub-list details.abstract > summary,
  details.abstract > summary {
    display: inline !important;
    list-style: none !important;
    margin-left: 6px;
  }
  details.abstract > summary::-webkit-details-marker { display: none !important; }
  details.abstract > summary::marker { content: "" !important; }

  details.abstract .abstract-body {
    display: block;
    font-size: 0.9em;
    line-height: 1.6;
    background: #f2f2f2;
    padding: 14px 16px;
    margin-top: 8px;
    border-radius: 4px;
  }
</style>
